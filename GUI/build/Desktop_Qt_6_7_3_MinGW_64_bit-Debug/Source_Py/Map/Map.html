<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Ubicacion Actual</title>
    <link rel="stylesheet" href="Map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
</head>
<body>
    <div id="map"></div>
    
    <div class="info-panel">
        <h1>📍 Posicion Actual</h1>
        <div class="coordinates">
            <div>Latitud: <strong id="lat">---</strong></div>
            <div>Longitud: <strong id="lng">---</strong></div>
            <div id="accuracy-info"></div>
        </div>
        <div class="status" id="status">
            <span>Obteniendo tu ubicación...</span>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loading-text">Detectando tu ubicación...</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="Map.js"></script>
</body>
</html>
